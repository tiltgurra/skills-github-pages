<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Portfolio</title>
  <style>
    :root {
      --bg: #0e0e11;
      --card-bg: #18181c;
      --text: #e4e4e7;
      --muted: #a1a1aa;
      --accent: #6366f1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      padding: 2rem 1rem;
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 3rem;
      border-bottom: 1px solid #27272a;
      padding-bottom: 1.5rem;
    }

    h1 { font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem; }
    p.bio { color: var(--muted); font-size: 1rem; }

    .track-list { display: flex; flex-direction: column; gap: 1.5rem; }

    .track-card {
      background: var(--card-bg);
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .track-info { display: flex; justify-content: space-between; align-items: baseline; }
    .track-title { font-weight: 600; font-size: 1.1rem; }
    .track-meta { color: var(--muted); font-size: 0.85rem; }

    audio {
      width: 100%;
      height: 40px;
      border-radius: 4px;
      outline: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>Music Portfolio</h1>
    <p class="bio">Synthesizers, atmospheric soundscapes, and tracks in progress.</p>
  </header>

  <main class="track-list">

    <!-- Track Item 1 -->
    <div class="track-card">
      <div class="track-info">
        <span class="track-title">01. Track Title Here</span>
        <span class="track-meta">FLAC / MP3 • 2026</span>
      </div>
      <audio controls src="audio/track1.mp3"></audio>
    </div>

    <!-- Track Item 2 -->
    <div class="track-card">
      <div class="track-info">
        <span class="track-title">02. Another Track Title</span>
        <span class="track-meta">Demo • 2026</span>
      </div>
      <audio controls src="audio/track2.mp3"></audio>
    </div>

  </main>

</body>
</html>
